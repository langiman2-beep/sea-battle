<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Battle — Langust Lab</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #0b132b;
        font-family: sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #splash {
        position: fixed;
        inset: 0;
        background: #0b132b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ff6b35;
        z-index: 10;
        transition: opacity 0.6s;
      }
      #splash h1 {
        font-size: 42px;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
      #splash p {
        color: #94a3b8;
        margin-top: 10px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <h1>LANGUST LAB</h1>
      <p>Спробуй свої сили та захисти місто</p>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
